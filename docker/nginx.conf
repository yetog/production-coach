server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Agent routes stay inside the compose network; the bridge is never
    # published to the host. The PAT therefore remains behind the agent
    # service boundary even in the containerized deployment.
    location /production-coach/api/projects/ {
        proxy_pass http://agent:3022/api/projects/;
    }
    location /production-coach/api/producer/ {
        proxy_pass http://agent:3022/api/producer/;
    }
    location /production-coach/api/actions/ {
        proxy_pass http://agent:3022/api/actions/;
    }
    location /production-coach/api/agent/ {
        proxy_pass http://agent:3022/api/agent/;
    }

    location /production-coach/api/ {
        proxy_pass http://chat:3021/api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
